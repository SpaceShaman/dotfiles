[org/gnome/desktop/background]
color-shading-type='solid'
picture-options='zoom'
primary-color='#000000000000'
secondary-color='#000000000000'

[org/gnome/desktop/screensaver]
color-shading-type='solid'
picture-options='zoom'
primary-color='#000000000000'
secondary-color='#000000000000'

[org/gnome/desktop/interface]
clock-show-date=false
clock-show-weekday=false
color-scheme='prefer-dark'
font-hinting='slight'
gtk-theme='Yaru-olive-dark'
icon-theme='Yaru-olive'
show-battery-percentage=true
toolkit-accessibility=false

[org/gnome/shell/extensions/materialshell/layouts]
default-layout='ratio'
float=false
gap=0
half=false
ratio=true
screen-gap=0
split=false
tween-time=0

[org/gnome/shell/extensions/materialshell/theme]
blur-background=false
focus-effect='default'
panel-icon-color=false
panel-icon-style='hybrid'
panel-opacity=30
panel-size=37
primary-color='#9a9996'
surface-opacity=0
theme='dark'

[org/gnome/shell/extensions/materialshell/tweaks]
cycle-through-windows=false
cycle-through-workspaces=false
enable-persistence=false

[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom4/']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Super>Return'
command='alacritty'
name='Terminal'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='<Super>f'
command='firefox'
name='Firefox'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2]
binding='<Super>c'
command='code'
name='Code'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3]
binding='<Super>t'
command='.scripts/theme.sh'
name='Theme'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom4]
binding='<Super>r'
command='xdg-screensaver reset'
name='Restart screensaver'

[org/gnome/desktop/wm/keybindings]
maximize=['']
move-to-monitor-down=['']
move-to-monitor-left=['']
move-to-monitor-right=['']
move-to-monitor-up=['']
move-to-workspace-1=['']
move-to-workspace-last=['']
move-to-workspace-left=['']
move-to-workspace-right=['']
show-desktop=['']
switch-input-source=['']
switch-input-source-backward=['']
switch-to-workspace-1=['']
switch-to-workspace-last=['']
switch-to-workspace-left=['']
switch-to-workspace-right=['']
unmaximize=['']

[org/gnome/shell/keybindings]
switch-to-application-1=['']
switch-to-application-2=['']
switch-to-application-3=['']
switch-to-application-4=['']
switch-to-application-5=['']
switch-to-application-6=['']
switch-to-application-7=['']
switch-to-application-8=['']
switch-to-application-9=['']
toggle-application-view=['']
toggle-overview=['']

[org/gnome/mutter/keybindings]
toggle-tiled-left=['']
toggle-tiled-right=['']

[org/gnome/mutter/wayland/keybindings]
restore-shortcuts=['']

[org/gnome/pomodoro/plugins/actions]
actions-list=['/org/gnome/pomodoro/plugins/actions/action0/', '/org/gnome/pomodoro/plugins/actions/action1/', '/org/gnome/pomodoro/plugins/actions/action2/']

[org/gnome/pomodoro/plugins/actions/action0]
command='xdg-screensaver lock'
name='Lock screen for short break'
states=['short-break']
triggers=['start']

[org/gnome/pomodoro/plugins/actions/action1]
command="sh -c 'xdotool type \"ppp\" && xdotool key KP_Enter'"
name='Unlock screen after break'
states=['short-break']
triggers=['complete']

[org/gnome/pomodoro/plugins/actions/action2]
command="sh -c 'xdotool key super+alt+Right && alacritty -o font.size=50 cursor.style=Underline -e bash ~/.scripts/break.sh && xdg-screensaver lock'"
name='Lock screen for long brake'
states=['long-break']
triggers=['start']

[org/gnome/pomodoro/plugins/gnome]
hide-system-notifications=true

[org/gnome/pomodoro/plugins/sounds]
pomodoro-end-sound='loud-bell.ogg'
pomodoro-end-sound-volume=1.0
pomodoro-start-sound='loud-bell.ogg'
pomodoro-start-sound-volume=1.0

[org/gnome/pomodoro/preferences]
enabled-plugins=['sounds', 'notifications', 'actions']
long-break-duration=1800.0